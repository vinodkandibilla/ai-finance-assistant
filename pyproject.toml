[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-finance-assistant"
version = "0.1.0"
description = "A modular AI finance assistant service."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "fastembed>=0.2,<1",
    "httpx>=0.27,<1",
    "langchain>=0.3,<0.4",
    "langchain-community>=0.3,<0.4",
    "langchain-openai>=0.3,<0.4",
    "langchain-qdrant>=0.2,<2",
    "langgraph>=0.2,<2",
    "pydantic-settings>=2.5,<3",
    "qdrant-client>=1.11,<2",
    "structlog>=24.4,<26",
    "tenacity>=9,<10",
    "unstructured[pdf]>=0.16,<1",
    "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "coverage[toml]>=7.6,<8",
    "mypy>=1.11,<2",
    "pre-commit>=3.8,<5",
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<2",
    "pytest-cov>=5,<7",
    "ruff>=0.6,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-config --strict-markers"
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[tool.coverage.run]
branch = true
source = ["ai_finance_assistant"]

[tool.coverage.report]
show_missing = true
fail_under = 80