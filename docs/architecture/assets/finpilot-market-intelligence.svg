<text x="950.0" y="1198.4" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#18324b">Transient only: network timeout / interruption, HTTP 408 / 429 / 500 / 502 / 503 / 504, temporary-failure signals</text>
