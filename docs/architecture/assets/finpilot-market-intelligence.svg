<text x="950.0" y="1252.4" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#18324b">Permanent / unknown errors: no retry · Overall agent deadline: 30 s · Per-MCP-call timeout: post-MVP</text>
