<polygon points="750,845 745.6503446588877,835.9955289764732 754.3496553411123,835.9955289764732" fill="#688299"/>
<polyline points="1255,750 1255,800 1050,800 1050,845" fill="none" stroke="#688299" stroke-width="2"/>
<polygon points="1050,845 1045.6503446588877,835.9955289764732 1054.3496553411123,835.9955289764732" fill="#688299"/>
<rect x="60" y="380" width="740" height="145" rx="14" fill="#fff3db" stroke="#e6c98e" stroke-width="2"/>
<text x="430.0" y="416.68" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#18324b">Collection setup · before the write</text>
<text x="430.0" y="448.4" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#18324b">Create missing collection with dense cosine + sparse vector fields</text>
<text x="430.0" y="475.4" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#18324b">A sample dense embedding determines the vector dimension</text>
<text x="430.0" y="502.4" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#18324b">Existing nonempty collection is reused; ingestion is skipped</text>
<polyline points="150,525 150,800 150,920 540,920" fill="none" stroke="#b58a3d" stroke-width="2" stroke-dasharray="7 7"/>
<polygon points="540,920 530.9955289764732,924.3496553411123 530.9955289764732,915.6503446588877" fill="#b58a3d"/>
<text x="900" y="1048.86" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#18324b">Separate collections: finance_education_hybrid  •  tax_education_hybrid</text>
<text x="900" y="1088.58" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#60788d">Corpus preparation path, separate from online retrieval; initialization may trigger ingestion when the index is missing or empty.</text>
<text x="900" y="1119.76" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#60788d">Qdrant is the vector database; a collection is its storage container. Embedding and persistence are handled by the vector-store integration.</text>
