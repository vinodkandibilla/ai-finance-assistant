<rect x="960" y="160" width="360" height="145" rx="14" fill="#ffffff" stroke="#cbd8e5" stroke-width="2"/>
<text x="1140.0" y="196.68" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#18324b">3  Recursive text splitter</text>
<text x="1140.0" y="228.4" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#18324b">RecursiveCharacterTextSplitter</text>
<text x="1140.0" y="255.4" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#18324b">Split text with chunk overlap</text>
<text x="1140.0" y="282.4" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#18324b">Retain source metadata</text>
