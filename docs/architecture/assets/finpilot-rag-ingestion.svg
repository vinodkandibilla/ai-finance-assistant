<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1160" viewBox="0 0 1800 1160"><rect width="100%" height="100%" fill="#f4f7fb"/>
<text x="900" y="63.16" text-anchor="middle" font-family="Arial,sans-serif" font-size="38" font-weight="700" fill="#18324b">FinPilot · RAG corpus ingestion</text>
<text x="900" y="104.86" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" font-weight="400" fill="#60788d">Document preparation → hybrid embeddings → persistent Qdrant collection</text>
