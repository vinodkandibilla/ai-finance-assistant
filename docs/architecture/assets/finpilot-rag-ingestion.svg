<text x="240.0" y="255.4" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#18324b">Tax: curated JSONL corpus</text>
<text x="240.0" y="282.4" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#18324b">Extract text + source metadata</text>
<rect x="510" y="160" width="360" height="145" rx="14" fill="#ffffff" stroke="#cbd8e5" stroke-width="2"/>
