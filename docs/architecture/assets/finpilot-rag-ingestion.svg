<text x="1255.0" y="646.68" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#18324b">5b  Local sparse embeddings</text>
<text x="1255.0" y="678.4" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#18324b">FastEmbedSparse · Qdrant/bm25</text>
<text x="1255.0" y="705.4" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#18324b">Chunk text → sparse lexical vectors</text>
<text x="1255.0" y="732.4" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#18324b">Local execution</text>
