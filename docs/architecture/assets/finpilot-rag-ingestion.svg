<text x="545.0" y="646.68" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#18324b">5a  OpenAI embeddings</text>
<text x="545.0" y="678.4" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#18324b">OpenAIEmbeddings</text>
