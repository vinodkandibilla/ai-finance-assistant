<text x="690.0" y="228.4" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#18324b">page_content: extracted text</text>
<text x="690.0" y="255.4" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#18324b">metadata: source, page / title</text>
